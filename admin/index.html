<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Adventure Junction — Admin</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Alpine -->
    <script
        defer
        src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>

    <style>
        [x-cloak] {
            display: none !important;
        }

        body {
            -webkit-font-smoothing: antialiased;
        }

        input,
        textarea,
        select,
        button {
            font-family: inherit;
        }

        .field {
            width: 100%;
            padding: 13px 15px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            outline: none;
            background: white;
            font-size: 14px;
            transition: .2s ease;
        }

        .field:focus {
            border-color: #082C3D;
            box-shadow: 0 0 0 3px rgba(250, 204, 21, .18);
        }
    </style>
</head>


<body
    class="bg-[#F6F8F7] text-[#082C3D]"
    x-data="adminApp()"
    x-init="init()"
>


<!-- ================================================= -->
<!-- HEADER                                            -->
<!-- ================================================= -->

<header
    class="sticky top-0 z-50
           bg-white/90
           backdrop-blur-xl
           border-b border-gray-200"
>

    <div
        class="max-w-7xl mx-auto
               px-5 sm:px-7
               py-4
               flex items-center
               justify-between"
    >

        <div>

            <p
                class="text-[9px]
                       uppercase
                       tracking-[0.2em]
                       font-bold
                       text-gray-400"
            >
                Adventure Junction
            </p>

            <h1
                class="text-xl sm:text-2xl
                       font-black"
            >
                Expedition Manager
            </h1>

        </div>


        <div
            class="flex items-center gap-2"
        >

            <span
                x-show="session"
                class="hidden md:block
                       text-[11px]
                       text-gray-400"
                x-text="userEmail"
            ></span>


            <button
                x-show="session"
                @click="logout()"
                class="px-4 py-2
                       rounded-xl
                       bg-gray-100
                       text-xs
                       font-bold
                       hover:bg-gray-200"
            >
                Logout
            </button>

        </div>

    </div>

</header>



<!-- ================================================= -->
<!-- MAIN                                              -->
<!-- ================================================= -->

<main
    class="max-w-7xl mx-auto
           px-5 sm:px-7
           py-8 sm:py-10"
>


<!-- ================================================= -->
<!-- LOGIN                                             -->
<!-- ================================================= -->

<template x-if="!session">

    <div
        class="max-w-md mx-auto
               bg-white
               rounded-[28px]
               border border-gray-100
               shadow-xl
               p-7 sm:p-8"
    >

        <div class="mb-7">

            <p
                class="text-[10px]
                       uppercase
                       tracking-[0.2em]
                       font-bold
                       text-yellow-600"
            >
                Secure Access
            </p>

            <h2
                class="mt-2
                       text-2xl
                       font-black"
            >
                Admin Login
            </h2>

            <p
                class="mt-2
                       text-sm
                       text-gray-500"
            >
                Manage Adventure Junction expeditions.
            </p>

        </div>


        <input
            x-model="email"
            type="email"
            autocomplete="email"
            placeholder="Admin email"
            class="field"
        >


        <input
            x-model="password"
            type="password"
            autocomplete="current-password"
            placeholder="Password"
            @keydown.enter="login()"
            class="field mt-3"
        >


        <button
            @click="login()"
            :disabled="loading"
            class="w-full
                   mt-4
                   py-3.5
                   rounded-xl
                   bg-[#082C3D]
                   text-white
                   font-bold
                   hover:bg-[#0d4056]
                   disabled:opacity-50
                   transition"
        >

            <span
                x-text="
                    loading
                    ? 'Signing in...'
                    : 'Sign In'
                "
            ></span>

        </button>


        <p
            x-show="error"
            x-text="error"
            class="mt-4
                   text-sm
                   text-red-500"
        ></p>

    </div>

</template>



<!-- ================================================= -->
<!-- DASHBOARD                                         -->
<!-- ================================================= -->

<template x-if="session">

<div>


    <!-- ============================================= -->
    <!-- TITLE + ADD                                   -->
    <!-- ============================================= -->

    <div
        class="flex flex-col
               sm:flex-row
               sm:items-center
               justify-between
               gap-4
               mb-8"
    >

        <div>

            <h2
                class="text-3xl sm:text-4xl
                       font-black
                       tracking-tight"
            >
                Expeditions
            </h2>

            <p
                class="mt-1
                       text-sm
                       text-gray-500"
            >
                Create and manage your adventures.
            </p>

        </div>


        <button
            @click="openCreate()"
            class="inline-flex
                   items-center
                   justify-center
                   gap-2
                   px-5 py-3.5
                   rounded-xl
                   bg-[#082C3D]
                   text-white
                   text-sm
                   font-bold
                   shadow-lg
                   hover:bg-[#0d4056]
                   hover:-translate-y-0.5
                   transition"
        >

            <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M12 5v14M5 12h14"
                />
            </svg>

            Add New Event

        </button>

    </div>



    <!-- ============================================= -->
    <!-- EVENT LIST                                    -->
    <!-- ============================================= -->

    <div class="grid gap-4">

        <template
            x-for="event in events"
            :key="event.id"
        >

            <div
                class="bg-white
                       rounded-[22px]
                       border border-gray-100
                       p-4
                       shadow-sm
                       hover:shadow-md
                       transition"
            >

                <div
                    class="flex flex-col
                           md:flex-row
                           gap-4
                           md:items-center"
                >


                    <!-- IMAGE -->

                    <img
                        :src="event.image_url"
                        :alt="event.title"
                        class="w-full
                               md:w-32
                               h-40
                               md:h-24
                               object-cover
                               rounded-2xl
                               bg-gray-100"
                    >


                    <!-- INFO -->

                    <div class="flex-1 min-w-0">

                        <div
                            class="flex flex-wrap
                                   items-center gap-2"
                        >

                            <h3
                                class="font-extrabold
                                       text-lg"
                                x-text="event.title"
                            ></h3>


                            <span
                                class="px-2.5 py-1
                                       rounded-full
                                       text-[8px]
                                       font-black
                                       uppercase"
                                :class="
                                    event.is_open
                                    ? 'bg-emerald-100 text-emerald-700'
                                    : 'bg-gray-100 text-gray-500'
                                "
                                x-text="
                                    event.is_open
                                    ? 'OPEN'
                                    : 'CLOSED'
                                "
                            ></span>

                        </div>


                        <p
                            class="mt-1
                                   text-xs
                                   text-gray-400"
                        >

                            <span
                                x-text="event.category"
                            ></span>

                            <span> • ₹</span>

                            <span
                                x-text="formatPrice(event.price)"
                            ></span>

                        </p>


                        <div
                            class="mt-2
                                   flex flex-wrap
                                   gap-2"
                        >

                            <span
                                class="px-2.5 py-1
                                       rounded-lg
                                       bg-gray-50
                                       text-[10px]
                                       font-bold
                                       text-gray-500"
                            >
                                Total:
                                <span
                                    class="text-[#082C3D]"
                                    x-text="event.total_seats"
                                ></span>
                            </span>


                            <span
                                class="px-2.5 py-1
                                       rounded-lg
                                       bg-yellow-50
                                       text-[10px]
                                       font-bold
                                       text-yellow-700"
                            >
                                Reserved:
                                <span
                                    x-text="event.reserved_seats"
                                ></span>
                            </span>


                            <span
                                class="px-2.5 py-1
                                       rounded-lg
                                       bg-emerald-50
                                       text-[10px]
                                       font-bold
                                       text-emerald-700"
                            >
                                Available:
                                <span
                                    x-text="
                                        Math.max(
                                            0,
                                            Number(event.total_seats || 0)
                                            -
                                            Number(event.reserved_seats || 0)
                                        )
                                    "
                                ></span>
                            </span>

                        </div>

                    </div>



                    <!-- ACTIONS -->

                    <div
                        class="flex flex-col
                               sm:flex-row
                               gap-2"
                    >

                        <button
                            @click="openEdit(event)"
                            class="px-4 py-3
                                   rounded-xl
                                   bg-gray-100
                                   text-[#082C3D]
                                   text-xs
                                   font-bold
                                   hover:bg-gray-200"
                        >
                            Edit
                        </button>


                        <button
                            @click="toggleEvent(event)"
                            :disabled="event.saving"
                            class="px-4 py-3
                                   rounded-xl
                                   text-xs
                                   font-bold
                                   transition
                                   disabled:opacity-50"
                            :class="
                                event.is_open
                                ? 'bg-red-50 text-red-600 hover:bg-red-100'
                                : 'bg-emerald-500 text-white hover:bg-emerald-600'
                            "
                        >

                            <span
                                x-text="
                                    event.saving
                                    ? 'Saving...'
                                    : event.is_open
                                        ? 'Close Event'
                                        : 'Open Event'
                                "
                            ></span>

                        </button>

                    </div>

                </div>

            </div>

        </template>

    </div>



    <!-- EMPTY -->

    <div
        x-show="events.length === 0"
        x-cloak
        class="py-20
               text-center
               text-gray-400"
    >
        No expeditions found.
    </div>

</div>

</template>

</main>



<!-- ================================================= -->
<!-- CREATE / EDIT MODAL                               -->
<!-- ================================================= -->

<div
    x-show="editorOpen"
    x-cloak
    class="fixed inset-0 z-[100] overflow-y-auto"
>


    <!-- BACKDROP -->

    <div
        class="fixed inset-0
               bg-[#061E2A]/60
               backdrop-blur-sm"
        @click="closeEditor()"
    ></div>



    <!-- MODAL -->

    <div
        class="relative
               min-h-screen
               flex items-center
               justify-center
               p-4"
    >

        <div
            class="relative
                   w-full
                   max-w-5xl
                   bg-white
                   rounded-[28px]
                   shadow-2xl
                   overflow-hidden"
        >


            <!-- HEADER -->

            <div
                class="px-5 sm:px-7
                       py-5
                       border-b border-gray-100
                       flex items-center
                       justify-between"
            >

                <div>

                    <p
                        class="text-[9px]
                               uppercase
                               tracking-[0.2em]
                               font-bold
                               text-yellow-600"
                    >
                        Expedition
                    </p>

                    <h2
                        class="text-xl sm:text-2xl
                               font-black"
                        x-text="
                            editingId
                            ? 'Edit Event'
                            : 'Create New Event'
                        "
                    ></h2>

                </div>


                <button
                    @click="closeEditor()"
                    class="w-10 h-10
                           rounded-xl
                           bg-gray-100
                           flex items-center
                           justify-center
                           hover:bg-gray-200"
                >

                    <svg
                        class="w-5 h-5"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M6 6l12 12M18 6L6 18"
                        />
                    </svg>

                </button>

            </div>



            <!-- CONTENT -->

            <div
                class="grid
                       lg:grid-cols-[1fr_380px]"
            >


                <!-- ======================================= -->
                <!-- FORM                                    -->
                <!-- ======================================= -->

                <div
                    class="p-5 sm:p-7
                           max-h-[75vh]
                           overflow-y-auto"
                >

                    <div class="grid sm:grid-cols-2 gap-4">


                        <!-- EVENT NAME -->

                        <div class="sm:col-span-2">

                            <label
                                class="block mb-1.5
                                       text-xs
                                       font-bold"
                            >
                                Event Name
                            </label>

                            <input
                                x-model="form.title"
                                @input="generateSlug()"
                                type="text"
                                placeholder="Hidden Waterfall"
                                class="field"
                            >

                        </div>



                        <!-- SLUG -->

                        <div>

                            <label
                                class="block mb-1.5
                                       text-xs
                                       font-bold"
                            >
                                URL Slug
                            </label>

                            <input
                                x-model="form.slug"
                                type="text"
                                placeholder="hidden-waterfall"
                                class="field"
                            >

                            <p
                                class="mt-1
                                       text-[10px]
                                       text-gray-400"
                            >
                                /book=<span
                                    x-text="
                                        form.slug ||
                                        'hidden-waterfall'
                                    "
                                ></span>
                            </p>

                        </div>



                        <!-- CATEGORY -->

                        <div>

                            <label
                                class="block mb-1.5
                                       text-xs
                                       font-bold"
                            >
                                Category
                            </label>

                            <input
                                x-model="form.category"
                                type="text"
                                placeholder="TREKKING"
                                class="field"
                            >

                        </div>



                        <!-- PRICE -->

                        <div>

                            <label
                                class="block mb-1.5
                                       text-xs
                                       font-bold"
                            >
                                Price ₹
                            </label>

                            <input
                                x-model="form.price"
                                type="number"
                                min="0"
                                step="1"
                                placeholder="1499"
                                class="field"
                            >

                        </div>



                        <!-- IMAGE -->

                        <div>

                            <label
                                class="block mb-1.5
                                       text-xs
                                       font-bold"
                            >
                                Image URL
                            </label>

                            <input
                                x-model="form.image_url"
                                type="url"
                                placeholder="https://..."
                                class="field"
                            >

                        </div>



                        <!-- TOTAL SEATS -->

                        <div>

                            <label
                                class="block mb-1.5
                                       text-xs
                                       font-bold"
                            >
                                Total Seats
                            </label>

                            <input
                                x-model.number="form.total_seats"
                                type="number"
                                min="0"
                                placeholder="30"
                                class="field"
                            >

                        </div>



                        <!-- RESERVED SEATS -->

                        <div>

                            <label
                                class="block mb-1.5
                                       text-xs
                                       font-bold"
                            >
                                Reserved Seats
                            </label>

                            <input
                                x-model.number="form.reserved_seats"
                                type="number"
                                min="0"
                                :max="form.total_seats"
                                placeholder="0"
                                class="field"
                            >

                            <p
                                class="mt-1
                                       text-[10px]
                                       text-gray-400"
                            >
                                Reserved seats cannot exceed total seats.
                            </p>

                        </div>



                        <!-- AVAILABILITY -->

                        <div
                            class="sm:col-span-2
                                   p-4
                                   rounded-2xl
                                   bg-gray-50"
                        >

                            <div
                                class="flex items-center
                                       justify-between"
                            >

                                <div>

                                    <p
                                        class="text-sm
                                               font-bold"
                                    >
                                        Seat Availability
                                    </p>

                                    <p
                                        class="text-[11px]
                                               text-gray-400"
                                    >
                                        Automatically calculated.
                                    </p>

                                </div>


                                <div
                                    class="text-right"
                                >

                                    <p
                                        class="text-2xl
                                               font-black
                                               text-emerald-600"
                                        x-text="
                                            Math.max(
                                                0,
                                                Number(form.total_seats || 0)
                                                -
                                                Number(form.reserved_seats || 0)
                                            )
                                        "
                                    ></p>

                                    <p
                                        class="text-[9px]
                                               uppercase
                                               tracking-wider
                                               font-bold
                                               text-gray-400"
                                    >
                                        Available

                                    </p>

                                </div>

                            </div>

                        </div>



                        <!-- OPEN / CLOSE -->

                        <div
                            class="sm:col-span-2
                                   p-4
                                   rounded-2xl
                                   bg-gray-50
                                   flex items-center
                                   justify-between"
                        >

                            <div>

                                <p
                                    class="text-sm
                                           font-bold"
                                >
                                    Event Status
                                </p>

                                <p
                                    class="text-[11px]
                                           text-gray-400"
                                >
                                    Closed events won't appear publicly.
                                </p>

                            </div>


                            <button
                                type="button"
                                @click="
                                    form.is_open =
                                    !form.is_open
                                "
                                class="relative
                                       w-12 h-7
                                       rounded-full
                                       transition"
                                :class="
                                    form.is_open
                                    ? 'bg-emerald-500'
                                    : 'bg-gray-300'
                                "
                            >

                                <span
                                    class="absolute
                                           top-1
                                           w-5 h-5
                                           bg-white
                                           rounded-full
                                           shadow
                                           transition"
                                    :class="
                                        form.is_open
                                        ? 'left-6'
                                        : 'left-1'
                                    "
                                ></span>

                            </button>

                        </div>

                    </div>



                    <!-- DELETE -->

                    <div
                        x-show="editingId"
                        class="mt-7
                               pt-5
                               border-t border-gray-100"
                    >

                        <button
                            @click="deleteEvent()"
                            class="text-xs
                                   font-bold
                                   text-red-500
                                   hover:text-red-700"
                        >
                            Delete this event
                        </button>

                    </div>

                </div>



                <!-- ======================================= -->
                <!-- LIVE PREVIEW                            -->
                <!-- ======================================= -->

                <div
                    class="bg-[#F6F8F7]
                           border-l border-gray-100
                           p-5 sm:p-7"
                >

                    <div class="sticky top-0">

                        <div class="mb-5">

                            <p
                                class="text-[9px]
                                       uppercase
                                       tracking-[0.2em]
                                       font-bold
                                       text-yellow-600"
                            >
                                Live Preview
                            </p>

                            <h3
                                class="mt-1
                                       text-lg
                                       font-black"
                            >
                                Public Card
                            </h3>

                        </div>



                        <!-- CARD -->

                        <div
                            class="relative
                                   block
                                   overflow-hidden
                                   rounded-[24px]
                                   bg-[#082C3D]
                                   aspect-[4/4.7]
                                   shadow-[0_22px_55px_rgba(8,44,61,.18)]"
                        >

                            <img
                                :src="
                                    form.image_url ||
                                    'https://images.unsplash.com/photo-1522163182402-834f871fd851?q=80&w=1000&auto=format&fit=crop'
                                "
                                class="absolute inset-0
                                       w-full h-full
                                       object-cover"
                                @error="
                                    $event.target.src =
                                    'https://images.unsplash.com/photo-1522163182402-834f871fd851?q=80&w=1000&auto=format&fit=crop'
                                "
                            >


                            <div
                                class="absolute inset-0
                                       bg-gradient-to-t
                                       from-[#061E2A]/95
                                       via-[#061E2A]/15
                                       to-black/5"
                            ></div>


                            <!-- CATEGORY -->

                            <div
                                class="absolute
                                       top-4 left-4 right-4
                                       flex items-start
                                       justify-between
                                       z-10"
                            >

                                <span
                                    class="px-3 py-1.5
                                           rounded-full
                                           bg-white/90
                                           backdrop-blur-xl
                                           text-[#082C3D]
                                           text-[9px]
                                           uppercase
                                           tracking-[0.16em]
                                           font-black"
                                    x-text="
                                        form.category ||
                                        'CATEGORY'
                                    "
                                ></span>


                                <span
                                    class="w-9 h-9
                                           rounded-full
                                           bg-white/15
                                           backdrop-blur-xl
                                           border border-white/20
                                           flex items-center
                                           justify-center
                                           text-white"
                                >

                                    <svg
                                        class="w-4 h-4"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        viewBox="0 0 24 24"
                                    >
                                        <path
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                            d="M5 12h14M13 6l6 6-6 6"
                                        />
                                    </svg>

                                </span>

                            </div>



                            <!-- NAME / PRICE -->

                            <div
                                class="absolute
                                       left-5 right-5 bottom-5
                                       z-10"
                            >

                                <h3
                                    class="text-xl sm:text-2xl
                                           leading-[1.05]
                                           tracking-[-0.03em]
                                           font-black
                                           text-white
                                           max-w-[85%]"
                                    x-text="
                                        form.title ||
                                        'Your Expedition Name'
                                    "
                                ></h3>


                                <div
                                    class="mt-4
                                           pt-3
                                           border-t border-white/15
                                           flex items-center
                                           justify-between"
                                >

                                    <span
                                        class="text-[9px]
                                               uppercase
                                               tracking-[0.18em]
                                               font-bold
                                               text-white/55"
                                    >
                                        Adventure Junction
                                    </span>


                                    <span
                                        class="text-sm
                                               font-black
                                               text-yellow-400"
                                        x-text="
                                            '₹' +
                                            formatPrice(
                                                form.price || 0
                                            )
                                        "
                                    ></span>

                                </div>

                            </div>

                        </div>



                        <!-- PUBLIC URL -->

                        <div
                            class="mt-4
                                   px-4 py-3
                                   rounded-xl
                                   bg-white
                                   border border-gray-100"
                        >

                            <p
                                class="text-[9px]
                                       uppercase
                                       tracking-[0.15em]
                                       font-bold
                                       text-gray-400"
                            >
                                Public Booking URL
                            </p>

                            <p
                                class="mt-1
                                       text-xs
                                       font-bold
                                       text-[#082C3D]
                                       break-all"
                            >
                                /book=<span
                                    x-text="
                                        form.slug ||
                                        'event-slug'
                                    "
                                ></span>
                            </p>

                        </div>

                    </div>

                </div>

            </div>



            <!-- FOOTER -->

            <div
                class="px-5 sm:px-7
                       py-4
                       border-t border-gray-100
                       flex flex-col-reverse
                       sm:flex-row
                       justify-end
                       gap-2"
            >

                <button
                    @click="closeEditor()"
                    class="px-5 py-3
                           rounded-xl
                           bg-gray-100
                           text-xs
                           font-bold
                           hover:bg-gray-200"
                >
                    Cancel
                </button>


                <button
                    @click="saveEvent()"
                    :disabled="saving"
                    class="px-6 py-3
                           rounded-xl
                           bg-[#082C3D]
                           text-white
                           text-xs
                           font-bold
                           hover:bg-[#0d4056]
                           disabled:opacity-50"
                >

                    <span
                        x-text="
                            saving
                            ? 'Saving...'
                            : editingId
                                ? 'Save Changes'
                                : 'Create Event'
                        "
                    ></span>

                </button>

            </div>

        </div>

    </div>

</div>



<!-- ================================================= -->
<!-- TOAST                                             -->
<!-- ================================================= -->

<div
    x-show="toast"
    x-cloak
    x-transition
    class="fixed
           bottom-5
           left-1/2
           -translate-x-1/2
           z-[200]
           px-5 py-3
           rounded-2xl
           bg-[#082C3D]
           text-white
           shadow-2xl
           text-xs
           font-bold"
    x-text="toast"
></div>



<script>

const SUPABASE_URL =
    'https://salaxcyxgwjqemryqwkx.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
    'sb_publishable_7mesl3BgJVam7bcR-rcOag_908xtgoO';


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        }
    );



function adminApp() {

    return {

        session: null,

        userEmail: '',

        email: '',

        password: '',

        events: [],

        loading: false,

        saving: false,

        error: '',

        toast: '',

        editorOpen: false,

        editingId: null,



        form: {

            title: '',

            slug: '',

            category: '',

            price: '',

            image_url: '',

            total_seats: 0,

            reserved_seats: 0,

            is_open: true

        },



        // =============================================
        // INIT
        // =============================================

        async init() {

            const {
                data
            } = await supabaseClient
                .auth
                .getSession();


            this.session =
                data.session;


            if (this.session) {

                this.userEmail =
                    this.session.user.email || '';

                await this.loadEvents();

            }


            supabaseClient
                .auth
                .onAuthStateChange(
                    async (_event, session) => {

                        this.session =
                            session;


                        if (session) {

                            this.userEmail =
                                session.user.email || '';

                            await this.loadEvents();

                        } else {

                            this.userEmail = '';

                            this.events = [];

                        }

                    }
                );

        },



        // =============================================
        // LOGIN
        // =============================================

        async login() {

            this.loading = true;

            this.error = '';


            const {
                error
            } = await supabaseClient
                .auth
                .signInWithPassword({

                    email: this.email,

                    password: this.password

                });


            if (error) {

                this.error =
                    error.message;

            }


            this.loading = false;

        },



        // =============================================
        // LOGOUT
        // =============================================

        async logout() {

            await supabaseClient
                .auth
                .signOut();

            this.session = null;

            this.events = [];

        },



        // =============================================
        // LOAD EVENTS
        // =============================================

        async loadEvents() {

            const {
                data,
                error
            } = await supabaseClient
                .from('expeditions')
                .select(
                    'id,title,slug,category,price,image_url,is_open,total_seats,reserved_seats,created_at,updated_at'
                )
                .order(
                    'created_at',
                    {
                        ascending: false
                    }
                );


            if (error) {

                console.error(
                    'Supabase load error:',
                    error
                );

                this.showToast(
                    'Unable to load events'
                );

                return;

            }


            this.events =
                data || [];

        },



        // =============================================
        // CREATE
        // =============================================

        openCreate() {

            this.editingId = null;


            this.form = {

                title: '',

                slug: '',

                category: 'TREKKING',

                price: '',

                image_url: '',

                total_seats: 0,

                reserved_seats: 0,

                is_open: true

            };


            this.editorOpen = true;

        },



        // =============================================
        // EDIT
        // =============================================

        openEdit(event) {

            this.editingId =
                event.id;


            this.form = {

                title:
                    event.title || '',

                slug:
                    event.slug || '',

                category:
                    event.category || '',

                price:
                    event.price || '',

                image_url:
                    event.image_url || '',

                total_seats:
                    Number(
                        event.total_seats || 0
                    ),

                reserved_seats:
                    Number(
                        event.reserved_seats || 0
                    ),

                is_open:
                    event.is_open === true

            };


            this.editorOpen =
                true;

        },



        // =============================================
        // CLOSE EDITOR
        // =============================================

        closeEditor() {

            if (this.saving) {
                return;
            }

            this.editorOpen = false;

        },



        // =============================================
        // AUTO SLUG
        // =============================================

        generateSlug() {

            if (this.editingId) {
                return;
            }


            this.form.slug =
                this.form.title

                    .toLowerCase()

                    .trim()

                    .replace(
                        /['’]/g,
                        ''
                    )

                    .replace(
                        /[^a-z0-9]+/g,
                        '-'
                    )

                    .replace(
                        /^-+|-+$/g,
                        ''
                    );

        },



        // =============================================
        // SAVE
        // =============================================

        async saveEvent() {

            const title =
                this.form.title.trim();

            const slug =
                this.form.slug.trim().toLowerCase();

            const category =
                this.form.category.trim().toUpperCase();

            const image =
                this.form.image_url.trim();


            if (!title) {

                this.showToast(
                    'Enter event name'
                );

                return;

            }


            if (!slug) {

                this.showToast(
                    'Enter URL slug'
                );

                return;

            }


            if (!category) {

                this.showToast(
                    'Enter category'
                );

                return;

            }


            if (!image) {

                this.showToast(
                    'Enter image URL'
                );

                return;

            }


            const totalSeats =
                Math.max(
                    0,
                    Number(
                        this.form.total_seats || 0
                    )
                );


            const reservedSeats =
                Math.max(
                    0,
                    Number(
                        this.form.reserved_seats || 0
                    )
                );


            if (
                reservedSeats >
                totalSeats
            ) {

                this.showToast(
                    'Reserved seats cannot exceed total seats'
                );

                return;

            }


            this.saving = true;


            const payload = {

                title: title,

                slug: slug,

                category: category,

                price:
                    Math.max(
                        0,
                        Number(
                            this.form.price || 0
                        )
                    ),

                image_url: image,

                total_seats:
                    totalSeats,

                reserved_seats:
                    reservedSeats,

                is_open:
                    !!this.form.is_open,

                updated_at:
                    new Date().toISOString()

            };


            let result;


            if (this.editingId) {

                result =
                    await supabaseClient
                        .from('expeditions')
                        .update(payload)
                        .eq(
                            'id',
                            this.editingId
                        )
                        .select()
                        .single();

            } else {

                result =
                    await supabaseClient
                        .from('expeditions')
                        .insert(payload)
                        .select()
                        .single();

            }


            if (result.error) {

                console.error(
                    result.error
                );

                this.showToast(
                    result.error.message
                );

                this.saving = false;

                return;

            }


            this.editorOpen =
                false;


            await this.loadEvents();


            this.showToast(
                this.editingId
                    ? 'Event updated successfully'
                    : 'Event created successfully'
            );


            this.saving = false;

        },



        // =============================================
        // OPEN / CLOSE
        // =============================================

        async toggleEvent(event) {

            if (event.saving) {
                return;
            }


            event.saving = true;


            const newState =
                !event.is_open;


            const {
                data,
                error
            } = await supabaseClient
                .from('expeditions')
                .update({

                    is_open:
                        newState,

                    updated_at:
                        new Date().toISOString()

                })
                .eq(
                    'id',
                    event.id
                )
                .select()
                .single();


            if (error) {

                console.error(
                    'Toggle error:',
                    error
                );

                this.showToast(
                    error.message
                );

            } else {

                event.is_open =
                    data.is_open;


                this.showToast(
                    newState
                        ? 'Event opened'
                        : 'Event closed'
                );

            }


            event.saving = false;

        },



        // =============================================
        // DELETE
        // =============================================

        async deleteEvent() {

            if (!this.editingId) {
                return;
            }


            if (
                !confirm(
                    'Delete this event permanently?'
                )
            ) {

                return;

            }


            this.saving = true;


            const {
                error
            } = await supabaseClient
                .from('expeditions')
                .delete()
                .eq(
                    'id',
                    this.editingId
                );


            if (error) {

                console.error(error);

                this.showToast(
                    error.message
                );

                this.saving = false;

                return;

            }


            this.editorOpen =
                false;


            await this.loadEvents();


            this.showToast(
                'Event deleted'
            );


            this.saving = false;

        },



        // =============================================
        // PRICE FORMAT
        // =============================================

        formatPrice(value) {

            return Number(
                value || 0
            ).toLocaleString(
                'en-IN'
            );

        },



        // =============================================
        // TOAST
        // =============================================

        showToast(message) {

            this.toast =
                message;


            clearTimeout(
                this.toastTimer
            );


            this.toastTimer =
                setTimeout(
                    () => {
                        this.toast = '';
                    },
                    3000
                );

        }

    };

}

</script>

</body>
