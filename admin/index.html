<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0"
    >

    <title>
        Adventure Junction — Admin
    </title>


    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script
        defer
        src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>


    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>

</head>


<body
    class="bg-[#F6F8F7] text-[#082C3D]"
    x-data="adminApp()"
    x-init="init()"
>


    <!-- ======================================== -->
    <!-- HEADER                                   -->
    <!-- ======================================== -->

    <header
        class="sticky top-0 z-50
               bg-white/90
               backdrop-blur-xl
               border-b border-gray-200"
    >

        <div
            class="max-w-6xl mx-auto
                   px-5 py-4
                   flex items-center
                   justify-between"
        >

            <div>

                <p
                    class="text-[9px]
                           uppercase
                           tracking-[0.2em]
                           font-bold
                           text-gray-400"
                >
                    Adventure Junction
                </p>

                <h1
                    class="text-xl
                           font-black"
                >
                    Expedition Manager
                </h1>

            </div>


            <button
                @click="logout()"
                class="px-4 py-2
                       rounded-xl
                       bg-gray-100
                       text-xs
                       font-bold
                       hover:bg-gray-200"
            >
                Logout
            </button>

        </div>

    </header>


    <!-- ======================================== -->
    <!-- LOGIN                                    -->
    <!-- ======================================== -->

    <main
        class="max-w-6xl mx-auto
               px-5 py-10"
    >

        <template x-if="!session">

            <div
                class="max-w-md mx-auto
                       bg-white
                       rounded-3xl
                       border border-gray-100
                       shadow-xl
                       p-7"
            >

                <div class="mb-7">

                    <p
                        class="text-[10px]
                               uppercase
                               tracking-[0.2em]
                               font-bold
                               text-yellow-600"
                    >
                        Secure Access
                    </p>

                    <h2
                        class="mt-2
                               text-2xl
                               font-black"
                    >
                        Admin Login
                    </h2>

                </div>


                <input
                    x-model="email"
                    type="email"
                    placeholder="Admin email"
                    class="w-full
                           px-4 py-3
                           rounded-xl
                           border border-gray-200
                           outline-none
                           focus:ring-2
                           focus:ring-yellow-400"
                >


                <input
                    x-model="password"
                    type="password"
                    placeholder="Password"
                    class="w-full
                           mt-3
                           px-4 py-3
                           rounded-xl
                           border border-gray-200
                           outline-none
                           focus:ring-2
                           focus:ring-yellow-400"
                >


                <button
                    @click="login()"
                    :disabled="loading"
                    class="w-full
                           mt-4
                           py-3.5
                           rounded-xl
                           bg-[#082C3D]
                           text-white
                           font-bold
                           hover:bg-[#0d4056]"
                >
                    <span
                        x-text="loading ? 'Signing in...' : 'Sign In'"
                    ></span>
                </button>


                <p
                    x-show="error"
                    x-text="error"
                    class="mt-4
                           text-sm
                           text-red-500"
                ></p>

            </div>

        </template>


        <!-- ======================================== -->
        <!-- ADMIN DASHBOARD                          -->
        <!-- ======================================== -->

        <template x-if="session">

            <div>

                <div
                    class="mb-8"
                >

                    <h2
                        class="text-3xl
                               font-black"
                    >
                        Expeditions
                    </h2>

                    <p
                        class="mt-1
                               text-sm
                               text-gray-500"
                    >
                        Open or close events shown on the public website.
                    </p>

                </div>


                <!-- EVENTS -->

                <div
                    class="grid
                           gap-4"
                >

                    <template
                        x-for="event in events"
                        :key="event.id"
                    >

                        <div
                            class="bg-white
                                   rounded-2xl
                                   border border-gray-100
                                   p-4
                                   flex flex-col
                                   sm:flex-row
                                   gap-4
                                   sm:items-center"
                        >

                            <img
                                :src="event.image_url"
                                class="w-full
                                       sm:w-28
                                       h-32
                                       sm:h-20
                                       object-cover
                                       rounded-xl"
                            >


                            <div class="flex-1">

                                <div
                                    class="flex items-center
                                           gap-2"
                                >

                                    <h3
                                        class="font-extrabold"
                                        x-text="event.title"
                                    ></h3>

                                    <span
                                        class="px-2 py-1
                                               rounded-full
                                               text-[8px]
                                               font-black
                                               uppercase"
                                        :class="
                                            event.is_open
                                            ? 'bg-emerald-100 text-emerald-700'
                                            : 'bg-gray-100 text-gray-500'
                                        "
                                        x-text="
                                            event.is_open
                                            ? 'OPEN'
                                            : 'CLOSED'
                                        "
                                    ></span>

                                </div>


                                <p
                                    class="mt-1
                                           text-xs
                                           text-gray-400"
                                >

                                    <span
                                        x-text="event.category"
                                    ></span>

                                    • ₹

                                    <span
                                        x-text="event.price"
                                    ></span>

                                </p>

                            </div>


                            <!-- TOGGLE -->

                            <button
                                @click="toggleEvent(event)"
                                :disabled="event.saving"
                                class="relative
                                       w-full sm:w-28
                                       h-11
                                       rounded-xl
                                       font-bold
                                       text-xs
                                       transition-all"
                                :class="
                                    event.is_open
                                    ? 'bg-red-50 text-red-600 hover:bg-red-100'
                                    : 'bg-emerald-500 text-white hover:bg-emerald-600'
                                "
                            >

                                <span
                                    x-text="
                                        event.saving
                                        ? 'Saving...'
                                        : event.is_open
                                            ? 'Close Event'
                                            : 'Open Event'
                                    "
                                ></span>

                            </button>

                        </div>

                    </template>

                </div>


                <!-- EMPTY -->

                <div
                    x-show="events.length === 0"
                    class="py-20
                           text-center
                           text-gray-400"
                >
                    No expeditions found.
                </div>

            </div>

        </template>

    </main>


<script>

const SUPABASE_URL =
    'https://salaxcyxgwjqemryqwkx.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
    'sb_publishable_7mesl3BgJVam7bcR-rcOag_908xtgoO';


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


function adminApp() {

    return {

        session: null,

        email: '',

        password: '',

        events: [],

        loading: false,

        error: '',


        async init() {

            const {
                data
            } = await supabaseClient
                .auth
                .getSession();

            this.session = data.session;


            supabaseClient
                .auth
                .onAuthStateChange(
                    (_event, session) => {

                        this.session = session;

                        if (session) {
                            this.loadEvents();
                        }

                    }
                );


            if (this.session) {

                await this.loadEvents();

            }

        },


        async login() {

            this.loading = true;

            this.error = '';


            const {
                error
            } = await supabaseClient
                .auth
                .signInWithPassword({

                    email: this.email,

                    password: this.password

                });


            if (error) {

                this.error =
                    error.message;

            }


            this.loading = false;

        },


        async logout() {

            await supabaseClient
                .auth
                .signOut();

            this.session = null;

            this.events = [];

        },


        async loadEvents() {

            const {
                data,
                error
            } = await supabaseClient
                .from('expeditions')
                .select('*')
                .order(
                    'created_at',
                    {
                        ascending: false
                    }
                );


            if (error) {

                console.error(error);

                return;

            }


            this.events = data || [];

        },


        async toggleEvent(event) {

            event.saving = true;


            const newState =
                !event.is_open;


            const {
                error
            } = await supabaseClient
                .from('expeditions')
                .update({

                    is_open: newState,

                    updated_at:
                        new Date().toISOString()

                })
                .eq('id', event.id);


            if (error) {

                alert(
                    'Unable to update event: ' +
                    error.message
                );

            } else {

                event.is_open =
                    newState;

            }


            event.saving = false;

        }

    };

}

</script>

</body>

</html>
